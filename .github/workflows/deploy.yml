# Deploy do PerFisio: build da imagem, push no registry da Magalu Cloud e deploy no Dokploy.
#
# Pull request: build only, so a broken Dockerfile shows up before main.
# Push: build, push :latest and :sha-<commit> to the Magalu Cloud registry,
# then ask Dokploy to deploy (the app pulls :latest).
# Rollback: set the image tag to sha-<commit> in Dokploy and deploy.
#
# Secrets (repo → Settings → Secrets and variables → Actions):
#   MGC_REGISTRY_USERNAME, MGC_REGISTRY_PASSWORD   `mgc container-registry credentials get`
#   DOKPLOY_URL, DOKPLOY_APP_ID, DOKPLOY_API_KEY   Dokploy panel
# Without the DOKPLOY_* secrets the image is still pushed; the deploy is skipped.

name: Deploy

on:
  pull_request:
  push:
    branches: ['main']
    # o que não entra na imagem
    paths-ignore:
      - '*.md'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: container-registry.br-se1.magalu.cloud
  IMAGE_NAME: conjunta-registry/perfisio
  NODE_VERSION: '22'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.MGC_REGISTRY_USERNAME }}
          password: ${{ secrets.MGC_REGISTRY_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NODE_VERSION=${{ env.NODE_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy on Dokploy
        if: github.event_name != 'pull_request'
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_APP_ID: ${{ secrets.DOKPLOY_APP_ID }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
        run: |
          if [ -z "$DOKPLOY_URL" ] || [ -z "$DOKPLOY_APP_ID" ] || [ -z "$DOKPLOY_API_KEY" ]; then
            echo "::warning::DOKPLOY_* secrets not set: image pushed, deploy skipped"
            exit 0
          fi
          curl --fail-with-body -sS -X POST "$DOKPLOY_URL/api/application.deploy" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -H 'Content-Type: application/json' \
            -d "{\"applicationId\":\"$DOKPLOY_APP_ID\",\"title\":\"CI: ${GITHUB_SHA::7}\"}"
